# 점검 규칙(rules.js)·엔진·Worker 소스가 바뀌면 worker/worker.js 를 자동으로 다시 만듭니다.
# (선택) 저장소 Secrets에 CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID 를 넣으면 Cloudflare에 자동 배포까지 합니다.
name: Worker 자동 빌드·배포
on:
  push:
    branches: [main]
    paths: ['assets/rules.js', 'assets/engine.js', 'worker/worker-src.js', 'tools/build-worker.mjs']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Node.js 보안 업데이트 권고(KrCERT 2026.10.23.: CVE-2026-105482·105483·106069) 패치 버전만 사용
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          check-latest: true
      - name: Node.js 패치 버전 확인(24.22.1 이상)
        run: node tools/check-node.mjs
      - name: worker.js 만들기
        run: node tools/build-worker.mjs && node --check worker/worker.js
      - name: 바뀐 내용 저장(commit)
        run: |
          if ! git diff --quiet worker/worker.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add worker/worker.js
            git commit -m "worker.js 자동 빌드"
            git push
          fi
      - name: (선택) Cloudflare 자동 배포
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

